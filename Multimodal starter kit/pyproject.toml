[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgenai-agent"
version = "0.1.0"
description = "Trust GenAI Agent package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno[os]",
    "ddgs",
    "google-genai",
    "lancedb",
    "mcp",
    "numpy",
    "openai",
    "opencv-python-headless",
    "openTSNE",
    "pandas",
    "pillow",
    "plotly",
    "pyarrow",
    "redis",
    "websockets",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tgenai_agent*"]
